# rEFInd - configuracao principal
# Backup/referencia versionada. Deploy para a ESP em /boot/EFI/refind/refind.conf

timeout 5

# Resolucao nativa do painel (eDP-1 1920x1200). Se o firmware nao suportar,
# o rEFInd cai pra maior resolucao de texto disponivel.
resolution 1920 1200

# Boot grafico sem spam de mensagens de texto na selecao do kernel
use_graphics_for linux

# Auto-deteccao: acha o kernel /vmlinuz-linux e inclui intel-ucode.img
# automaticamente (corrige o microcode que o systemd-boot nao carregava).
scanfor manual,internal,external,optical

# Nao mostrar ferramentas que nao usamos (mantem o menu limpo)
showtools shutdown,reboot,firmware

include themes/stratus/theme.conf
