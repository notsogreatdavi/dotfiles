# Mudar a tecla de prefixo de C-b para C-a
# C-a é mais fácil de alcançar e é o padrão do 'screen'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Habilitar o modo mouse
# Permite redimensionar painéis, selecionar janelas e rolar com o mouse
set -g mouse on

# Começar a numeração de janelas e painéis em 1, em vez de 0
set -g base-index 1
setw -g pane-base-index 1

# Dividir painéis com | e - (mais intuitivo)
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Navegação entre painéis no estilo Vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mudar o tempo de espera de comandos para não haver delay
set -s escape-time 0

# Aumentar o histórico de scroll
set -g history-limit 10000

# Lista de plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator' # Plugin de integração que já tínhamos

# --- Tema Stratus (11.06_visual-identity/design-system.md) ---
# #0C1018 dark.background · #1B2637 dark.elevated · #293849 dark.border
# #C8D4E3 text.primary · #7A90A8 text.secondary · #4A5A70 text.muted
# #6BA3E8 accent.primary · #E0B84A status.warning
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#7A90A8"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[fg=#6BA3E8,bold]#S  "
set -g status-right "#{?client_prefix,#[fg=#E0B84A]prefix  ,}#[fg=#7A90A8]%a %d %b  #[fg=#C8D4E3]%H:%M "
setw -g window-status-separator "  "
setw -g window-status-format "#[fg=#7A90A8]#I #W#{?window_activity_flag,#[fg=#E0B84A] ·,}#{?window_bell_flag,#[fg=#CC6070] ·,}"
setw -g window-status-current-format "#[bg=#1B2637,fg=#C8D4E3] #I #W "
setw -g monitor-activity on
set -g visual-activity off
set -g pane-border-style "fg=#293849"
set -g pane-active-border-style "fg=#6BA3E8"
set -g message-style "bg=#131B28,fg=#C8D4E3"
set -g message-command-style "bg=#131B28,fg=#6BA3E8"
setw -g mode-style "bg=#1B2637,fg=#C8D4E3"
set -g display-panes-active-colour "#6BA3E8"
set -g display-panes-colour "#293849"
setw -g clock-mode-colour "#6BA3E8"



# Inicializa o TPM (deve ser a última linha do arquivo)
run '~/.tmux/plugins/tpm/tpm''
