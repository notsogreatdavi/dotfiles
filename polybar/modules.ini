; ─── Workspaces ───────────────────────────────────────────────────────────────

[module/workspaces]
type            = internal/i3
index-sort      = true
strip-wsnumbers = true

label-focused            = %index%
label-focused-background = ${color.primary}
label-focused-foreground = ${color.background}
label-focused-padding    = 2

label-unfocused            = %index%
label-unfocused-foreground = ${color.deep-blue}
label-unfocused-background = ${color.background-alt}
label-unfocused-padding    = 2

label-urgent            = %index%
label-urgent-background = ${color.alert}
label-urgent-foreground = ${color.foreground}
label-urgent-padding    = 2

label-visible            = %index%
label-visible-background = ${color.background-alt}
label-visible-foreground = ${color.secondary}
label-visible-padding    = 2

; ─── Window Title ─────────────────────────────────────────────────────────────

[module/window_title]
type = internal/xwindow

format-background        = ${color.background-alt}
format-padding           = 1
format-prefix            = "󰖯 "
format-prefix-foreground = ${color.primary}

label            = %title:0:35:...%
label-foreground = ${color.foreground-alt}

; ─── Relógio ──────────────────────────────────────────────────────────────────

[module/time]
type     = internal/date
time     = %H:%M
date     = %a, %d %b
interval = 30

format-background        = ${color.background-alt}
format-padding           = 1
format-prefix            = "󰥔 "
format-prefix-foreground = ${color.primary}

label            = %time%  󰃮 %date%
label-foreground = ${color.foreground-alt}

; ─── Áudio ────────────────────────────────────────────────────────────────────

[module/pulseaudio]
type     = custom/script
exec     = /home/notsogreatdavi/.config/polybar/scripts/volume-status.sh
interval = 2

format-background = ${color.background-alt}
format-padding    = 1

; ─── Wi-Fi ────────────────────────────────────────────────────────────────────

[module/wlan]
type       = custom/script
exec       = /home/notsogreatdavi/.config/polybar/scripts/wlan-status.sh
interval   = 5
click-left = bash /home/notsogreatdavi/.config/polybar/scripts/networkmenu.sh

format-background = ${color.background-alt}
format-padding    = 1
label-foreground  = ${color.foreground-alt}

; ─── Bateria ──────────────────────────────────────────────────────────────────

[module/battery]
type          = internal/battery
battery       = BAT0
adapter       = ACAD
low-at        = 20
poll-interval = 5

format-charging-background = ${color.background-alt}
format-charging-padding    = 1
format-charging            = <animation-charging> <label-charging>
label-charging             = %percentage%%
label-charging-foreground  = ${color.green}

format-discharging-background = ${color.background-alt}
format-discharging-padding    = 1
format-discharging            = <ramp-capacity> <label-discharging>
label-discharging             = %percentage%%
label-discharging-foreground  = ${color.foreground-alt}

format-full-background = ${color.background-alt}
format-full-padding    = 1
format-full            = <label-full>
label-full             = 󰁹 %percentage%%
label-full-foreground  = ${color.primary}

ramp-capacity-0            = 󰁺
ramp-capacity-1            = 󰁼
ramp-capacity-2            = 󰁾
ramp-capacity-3            = 󰂀
ramp-capacity-4            = 󰁹
ramp-capacity-foreground   = ${color.primary}
ramp-capacity-0-foreground = ${color.alert}

animation-charging-0          = 󰢜
animation-charging-1          = 󰂆
animation-charging-2          = 󰂈
animation-charging-3          = 󰂊
animation-charging-4          = 󰂄
animation-charging-foreground = ${color.green}
animation-charging-framerate  = 750

; ─── System Tray ──────────────────────────────────────────────────────────────

[module/tray]
type            = internal/tray
tray-padding    = 2
tray-background = ${color.background-alt}
