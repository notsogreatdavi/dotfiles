; ─── Pill caps (Powerline U+E0B6 / U+E0B4) ───────────────────────────────────

[module/pill-l]
type               = custom/text
content            = %{T3}%{T-}
content-foreground = ${color.background-alt}

[module/pill-r]
type               = custom/text
content            = %{T3}%{T-}
content-foreground = ${color.background-alt}

; ─── Spacer ───────────────────────────────────────────────────────────────────

[module/spacer]
type    = custom/text
content = "  "

; ─── Separador ────────────────────────────────────────────────────────────────

[module/sep]
type               = custom/text
content            = "|"
content-foreground = ${color.deep-blue}
content-background = ${color.background-alt}
content-padding    = 1

; ─── Launcher (App Menu) ──────────────────────────────────────────────────────

[module/launcher]
type               = custom/text
content            = "󰀻  Apps"
content-foreground = ${color.teal}
content-background = ${color.background-alt}
content-padding    = 1
click-left         = bash /home/notsogreatdavi/.config/polybar/scripts/launcher.sh

; ─── Bluetooth ────────────────────────────────────────────────────────────────

[module/bluetooth]
type               = custom/script
exec               = /home/notsogreatdavi/.config/polybar/scripts/btmenu.sh --status
interval           = 10
format-background  = ${color.background-alt}
format-padding     = 1
label-foreground   = ${color.primary}
click-left         = bash /home/notsogreatdavi/.config/polybar/scripts/btmenu.sh

; ─── System Menu (Power Menu) ─────────────────────────────────────────────────

[module/sysmenu]
type               = custom/text
content            = "󰐥"
content-foreground = ${color.alert}
content-background = ${color.background-alt}
content-padding    = 1
click-left         = bash /home/notsogreatdavi/.config/polybar/scripts/powermenu.sh
