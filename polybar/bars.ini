[bar/bar]
monitor           = ${env:MONITOR}
height            = 32
width             = 100%
offset-y          = 0.5%
radius            = 8.0
bottom            = false
background        = ${color.background}
border-color      = ${color.background}
border-size       = 3
override-redirect = false
wm-restack        = i3
padding-right     = 2
padding-left      = 2
module-margin     = 0
cursor-click      = pointer
cursor-scroll     = ns-resize

font-0 = "VictorMono Nerd Font Mono:style=Medium:pixelsize=9;2"
font-1 = "Font Awesome 7 Free:style=Solid:pixelsize=10;2"
font-2 = "VictorMono Nerd Font Mono:style=Medium:pixelsize=23;2"

modules-left   = pill-l launcher sep workspaces pill-r
modules-center = pill-l window_title pill-r
modules-right  = pill-l pulseaudio sep bluetooth sep wlan sep battery sep time sep sysmenu pill-r spacer tray
