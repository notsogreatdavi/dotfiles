; Polybar Config — Nord theme

[colors]
polar-night-1 = #2E3440
polar-night-2 = #3B4252
polar-night-3 = #434C5E
polar-night-4 = #4C566A

snow-storm-1 = #D8DEE9
snow-storm-2 = #E5E9F0
snow-storm-3 = #ECEFF4

frost-1 = #8FBCBB
frost-2 = #88C0D0
frost-3 = #81A1C1
frost-4 = #5E81AC

aurora-red    = #BF616A
aurora-orange = #D08770
aurora-yellow = #EBCB8B
aurora-green  = #A3BE8C
aurora-purple = #B48EAD

background     = ${colors.polar-night-1}
background-alt = ${colors.polar-night-2}
foreground     = ${colors.snow-storm-2}
foreground-alt = ${colors.snow-storm-1}
primary        = ${colors.frost-2}
secondary      = ${colors.frost-3}
alert          = ${colors.aurora-red}

[bar/bar]
monitor           = ${env:MONITOR}
height            = 32
width             = 100%
offset-y          = 0.5%
radius            = 8.0
bottom            = false
background        = ${colors.background}
override-redirect = false
wm-restack        = i3
padding-right     = 2
padding-left      = 2
module-margin     = 0
border-size       = 3

font-0 = "JetBrainsMono Nerd Font:style=Medium:pixelsize=9;2"
font-1 = "Font Awesome 7 Free:style=Solid:pixelsize=10;2"
font-2 = "JetBrainsMono Nerd Font:style=Medium:pixelsize=23;2"

modules-left   = pill-l workspaces pill-r 
modules-center = pill-l window_title pill-r
modules-right  = pill-l pulseaudio wlan battery pill-r spacer tray

; ─── Pill caps ────────────────────────────────────────────────────────────────
; U+E0B6  e U+E0B4  — Nerd Font Powerline Extra

[module/pill-l]
type               = custom/text
content            = %{T3}%{T-}
content-foreground = ${colors.background-alt}

[module/pill-r]
type               = custom/text
content            = %{T3}%{T-}
content-foreground = ${colors.background-alt}

[module/spacer]
type    = custom/text
content = "  "

; ─── Workspaces ───────────────────────────────────────────────────────────────

[module/workspaces]
type            = internal/i3
index-sort      = true
strip-wsnumbers = true

label-focused            = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding    = 2

label-unfocused            = %index%
label-unfocused-foreground = ${colors.polar-night-4}
label-unfocused-background = ${colors.background-alt}
label-unfocused-padding    = 2

label-urgent            = %index%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.foreground}
label-urgent-padding    = 2

label-visible            = %index%
label-visible-background = ${colors.background-alt}
label-visible-foreground = ${colors.secondary}
label-visible-padding    = 2

; ─── Window Title ─────────────────────────────────────────────────────────────

[module/window_title]
type = internal/xwindow

format-background        = ${colors.background-alt}
format-padding           = 1
format-prefix            = "󰖯 "
format-prefix-foreground = ${colors.primary}

label            = %title:0:35:...%
label-foreground = ${colors.foreground-alt}

; ─── Relógio ──────────────────────────────────────────────────────────────────

[module/time]
type = internal/date

format-background        = ${colors.background-alt}
format-padding           = 1
format-prefix            = "󰥔 "
format-prefix-foreground = ${colors.primary}

label            = %H:%M  󰃮 %a, %d %b
label-foreground = ${colors.foreground-alt}

; ─── Áudio ────────────────────────────────────────────────────────────────────

[module/pulseaudio]
type = internal/pulseaudio

format-volume-background = ${colors.background-alt}
format-volume-padding    = 1
format-volume            = <ramp-volume>  <label-volume>
label-volume             = %percentage%%
label-volume-foreground  = ${colors.foreground-alt}

format-muted-background = ${colors.background-alt}
format-muted-padding    = 1
label-muted             = 󰝟 Mudo
label-muted-foreground  = ${colors.alert}

ramp-volume-0          = 󰕿
ramp-volume-1          = 󰖀
ramp-volume-2          = 󰕾
ramp-volume-foreground = ${colors.primary}

; ─── Wi-Fi ────────────────────────────────────────────────────────────────────

[module/wlan]
type      = internal/network
interface = wlan0
interval  = 3.0

format-connected-background = ${colors.background-alt}
format-connected-padding    = 1
format-connected            = <ramp-signal>  <label-connected>
label-connected             = %essid%
label-connected-foreground  = ${colors.foreground-alt}

format-disconnected-background = ${colors.background-alt}
format-disconnected-padding    = 1
label-disconnected             = 󰤭 Sem rede
label-disconnected-foreground  = ${colors.alert}

ramp-signal-0            = 󰤟
ramp-signal-1            = 󰤢
ramp-signal-2            = 󰤥
ramp-signal-3            = 󰤨
ramp-signal-0-foreground = ${colors.alert}
ramp-signal-1-foreground = ${colors.aurora-yellow}
ramp-signal-2-foreground = ${colors.aurora-green}
ramp-signal-3-foreground = ${colors.primary}

; ─── Bateria ──────────────────────────────────────────────────────────────────

[module/battery]
type          = internal/battery
battery       = BAT0
adapter       = ACAD
low-at        = 20
poll-interval = 5

format-charging-background = ${colors.background-alt}
format-charging-padding    = 1
format-charging            = <animation-charging> <label-charging>
label-charging             = %percentage%%
label-charging-foreground  = ${colors.aurora-green}

format-discharging-background = ${colors.background-alt}
format-discharging-padding    = 1
format-discharging            = <ramp-capacity> <label-discharging>
label-discharging             = %percentage%%
label-discharging-foreground  = ${colors.foreground-alt}

format-full-background = ${colors.background-alt}
format-full-padding    = 1
format-full            = <label-full>
label-full             = 󰁹 %percentage%%
label-full-foreground  = ${colors.primary}

ramp-capacity-0            = 󰁺
ramp-capacity-1            = 󰁼
ramp-capacity-2            = 󰁾
ramp-capacity-3            = 󰂀
ramp-capacity-4            = 󰁹
ramp-capacity-foreground   = ${colors.primary}
ramp-capacity-0-foreground = ${colors.alert}

animation-charging-0          = 󰢜
animation-charging-1          = 󰂆
animation-charging-2          = 󰂈
animation-charging-3          = 󰂊
animation-charging-4          = 󰂄
animation-charging-foreground = ${colors.aurora-green}
animation-charging-framerate  = 750

; ─── System Tray ──────────────────────────────────────────────────────────────

[module/tray]
type            = internal/tray
tray-padding    = 2
tray-background = ${colors.background-alt}
