;==========================================================
; Polybar Config - Nord & Minimalist by Gemini
; (com todas as alterações solicitadas)
;==========================================================

[colors]
; Paleta de Cores Nord
; Polar Night (escuros)
polar-night-1 = #2E3440
polar-night-2 = #3B4252
polar-night-3 = #434C5E
polar-night-4 = #4C566A

; Snow Storm (claros)
snow-storm-1 = #D8DEE9
snow-storm-2 = #E5E9F0
snow-storm-3 = #ECEFF4

; Frost (azuis)
frost-1 = #8FBCBB
frost-2 = #88C0D0
frost-3 = #81A1C1
frost-4 = #5E81AC

; Aurora (cores de destaque)
aurora-red = #BF616A
aurora-orange = #D08770
aurora-yellow = #EBCB8B
aurora-green = #A3BE8C
aurora-purple = #B48EAD

; Mapeando para nomes genéricos para fácil uso
background = ${colors.polar-night-1}
background-alt = ${colors.polar-night-2}
foreground = ${colors.snow-storm-2}
foreground-alt = ${colors.snow-storm-1}
primary = ${colors.frost-2}
secondary = ${colors.frost-3}
alert = ${colors.aurora-red}

[bar/bar]
height = 30
width = 100%
offset-y = 0.5%
radius = 8.0
bottom = false
background = ${colors.background}
override-redirect = false
wm-restack = i3
padding-right = 2
padding-left = 2

; Fontes: Texto principal e depois ícones
font-0 = "JetBrainsMono Nerd Font:style=Medium:pixelsize=10;2"
font-1 = "Font Awesome 7 Free:style=Solid:pixelsize=10;2"

; Aumentamos o espaçamento entre módulos
module-margin = 3

; Módulos com o título da janela no centro
modules-left = workspaces
modules-center = window_title time
modules-right = pulseaudio wlan battery tray

; Desativando bordas para um visual mais limpo
border-size = 3

monitor = ${env:MONITOR}

[module/workspaces]
type = internal/i3

; Ordena por índice e remove números extras do nome
index-sort = true
strip-wsnumbers = true

; Workspace Focado (Ativo)
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 2

; Workspace Desfocado mas com Janelas (Ocupado)
label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2

; Workspace Urgente (Notificação)
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

; Workspace Visível em outro monitor (se houver)
label-visible = %index%
label-visible-padding = 2

[module/window_title]
type = internal/xwindow
; Exibe o título da janela com um comprimento máximo de 40 caracteres
label = %title:0:40:...%
label-foreground = ${colors.foreground-alt}

[module/wlan]
type = internal/network
; IMPORTANTE: Verifique se 'wlan0' é a sua interface de rede com 'ip addr'
interface = wlan0
interval = 3.0

format-connected = <ramp-signal> <label-connected>
label-connected = %essid%
label-connected-foreground = ${colors.foreground-alt}

format-disconnected = <label-disconnected>
label-disconnected = ﲁ Desconectado
label-disconnected-foreground = ${colors.alert}

ramp-signal-0 = 
ramp-signal-0-foreground = ${colors.primary}

[module/time]
type = internal/date
format = <label>
format-prefix = 
format-prefix-foreground = ${colors.primary}
label =  %H:%M | %a, %d %b
label-foreground = ${colors.foreground-alt}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted =  Mudo
label-muted-foreground = ${colors.alert}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.primary}

[module/battery]
type = internal/battery
low-at = 20
; IMPORTANTE: Verifique os nomes com 'ls /sys/class/power_supply/'
battery = BAT0
adapter = ACAD
poll-interval = 5

format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%
format-charging-foreground = ${colors.aurora-green}

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

format-full = <ramp-capacity> <label-full>
label-full = %percentage%%
format-full-foreground = ${colors.primary}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.primary}
ramp-capacity-0-foreground = ${colors.alert}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.aurora-green}
animation-charging-framerate = 750

[module/tray]
type = internal/tray
tray-padding = 2
tray-background = ${colors.background}
