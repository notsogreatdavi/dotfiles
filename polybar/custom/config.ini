; Polybar Stratus: 3 ilhas flutuantes (esquerda, centro, direita)
; Tokens em 11.06_visual-identity/design-system.md

[colors]
dark-background = #0C1018
dark-surface    = #131B28
dark-elevated   = #1B2637
dark-border     = #293849
text-primary    = #C8D4E3
text-secondary  = #7A90A8
text-muted      = #4A5A70
accent-primary  = #6BA3E8
accent-secondary = #8B6FBE
accent-highlight = #45C4C4
status-success  = #7ABF8A
status-warning  = #E0B84A
status-error    = #CC6070

; ─── Base comum das ilhas ─────────────────────────────────────────────────────
; altura 36, margem spacing.base (8), radius.default (5), borda dark.border 1px

[island]
monitor           = ${env:MONITOR}
height            = 36
offset-y          = 8
radius            = 5
bottom            = false
fixed-center      = true
override-redirect = true
wm-restack        = i3

background   = ${colors.dark-background}
foreground   = ${colors.text-primary}
border-size  = 1
border-color = ${colors.dark-border}
line-size    = 2

padding-left  = 2
padding-right = 2
module-margin = 1

font-0 = "VictorMono Nerd Font Mono:style=Medium:pixelsize=13;3"
font-1 = "Geist:style=Medium:pixelsize=12;3"
font-2 = "Geist:style=SemiBold:pixelsize=12;3"

enable-ipc    = true
cursor-click  = pointer
cursor-scroll = ns-resize

[bar/left]
inherit      = island
width        = 240
offset-x     = 8
modules-left = launcher divider workspaces

[bar/center]
inherit        = island
width          = 520
offset-x       = 50%:-260
modules-center = xwindow

; Espelhadas: left e clock têm a mesma largura e ficam a 8px das bordas
[bar/status]
inherit        = island
width          = 300
offset-x       = 100%:-556
modules-center = player-mpris-simple telegram openweathermap-simple sound bluetooth wifi battery

[bar/clock]
inherit       = island
width         = 240
offset-x      = 100%:-248
modules-left  = date day
modules-right = popup-powermenu

; ─── Esquerda ─────────────────────────────────────────────────────────────────

[module/launcher]
type               = custom/text
label              = 󰖐
label-foreground   = ${colors.accent-primary}
click-left         = bash ~/.config/rofi/launchers/type-7/launcher.sh

[module/divider]
type             = custom/text
label            = │
label-foreground = ${colors.dark-border}

; Estratos: traço largo (underline no padding todo) no ativo e no visível;
; traço curto (underline só no dígito, via %{+u}) nos ocupados e no urgente
[module/workspaces]
type            = internal/i3
pin-workspaces  = true
index-sort      = true
strip-wsnumbers = true
enable-click    = true
enable-scroll   = false

label-focused            = %index%
label-focused-background = ${colors.dark-elevated}
label-focused-foreground = ${colors.accent-primary}
label-focused-underline  = ${colors.accent-primary}
label-focused-padding    = 2

label-visible            = %index%
label-visible-background = ${colors.dark-elevated}
label-visible-foreground = ${colors.text-primary}
label-visible-underline  = ${colors.text-secondary}
label-visible-padding    = 2

label-unfocused            = "  %{u#7A90A8}%{+u}%index%%{-u}  "
label-unfocused-foreground = ${colors.text-secondary}

label-urgent            = "  %{u#CC6070}%{+u}%index%%{-u}  "
label-urgent-foreground = ${colors.status-error}

; ─── Centro ───────────────────────────────────────────────────────────────────

[module/xwindow]
type                     = internal/xwindow
format-prefix            = "󰆍 "
format-prefix-foreground = ${colors.accent-highlight}
label                    = %{T2}%title:0:60:…%%{T-}
label-empty              = %{T2}desktop%{T-}
label-foreground         = ${colors.text-secondary}
label-empty-foreground   = ${colors.text-muted}

; ─── Direita ──────────────────────────────────────────────────────────────────

[module/player-mpris-simple]
type             = custom/script
exec             = bash ~/.config/polybar/custom/scripts/player-mpris-simple.sh
interval         = 3
click-left       = playerctl play-pause &
click-right      = playerctl next &
double-click-right = playerctl previous &
label            = %{T2}%output:0:32:…%%{T-}
label-foreground = ${colors.text-secondary}

[module/telegram]
type             = custom/script
exec             = bash ~/.config/polybar/custom/scripts/telegram.sh
interval         = 3
click-right      = bash ~/.config/polybar/custom/scripts/rofi-telegram-menu.sh
label-foreground = ${colors.accent-primary}

[module/openweathermap-simple]
type             = custom/script
exec             = bash ~/.config/polybar/custom/scripts/openweathermap-simple.sh
interval         = 600
click-right      = bash ~/.config/polybar/custom/scripts/rofi-weather-menu.sh
label-foreground = ${colors.text-secondary}

[module/sound]
type             = custom/script
exec             = bash ~/.config/polybar/custom/scripts/sound.sh
interval         = 2
scroll-up        = bash ~/.config/polybar/custom/scripts/sound.sh up
scroll-down      = bash ~/.config/polybar/custom/scripts/sound.sh down
click-right      = bash ~/.config/polybar/custom/scripts/rofi-mixer-menu.sh
label-foreground = ${colors.text-secondary}

[module/bluetooth]
type             = custom/script
exec             = bash ~/.config/polybar/custom/scripts/bluetooth.sh
interval         = 10
click-right      = bash ~/.config/polybar/custom/scripts/rofi-bluetooth-menu.sh
label            = %output:0:24:…%
label-foreground = ${colors.accent-primary}

[module/wifi]
type             = custom/script
exec             = bash ~/.config/polybar/custom/scripts/wifi.sh
interval         = 5
click-right      = bash ~/.config/polybar/custom/scripts/rofi-wifi-menu.sh
label-foreground = ${colors.text-secondary}

[module/battery]
type             = custom/script
exec             = bash ~/.config/polybar/custom/scripts/battery.sh
interval         = 5
click-right      = bash ~/.config/polybar/custom/scripts/rofi-battery-menu.sh
label-foreground = ${colors.text-secondary}

[module/date]
type             = custom/script
exec             = bash ~/.config/polybar/custom/scripts/time.sh
interval         = 10
click-right      = bash ~/.config/polybar/custom/scripts/rofi-calendar-menu.sh
label            = %{T3}%output%%{T-}
label-foreground = ${colors.text-primary}

[module/day]
type             = internal/date
date             = %a %d %b
interval         = 60
label            = %{T2}%date%%{T-}
label-foreground = ${colors.text-secondary}

[module/popup-powermenu]
type             = custom/script
exec             = bash ~/.config/polybar/custom/scripts/popup-powermenu.sh
interval         = 5
click-left       = bash ~/.config/polybar/custom/scripts/popup-powermenu.sh --popup
click-right      = bash ~/.config/polybar/custom/scripts/powermenu.sh
label-foreground = ${colors.status-error}

[settings]
screenchange-reload = true
pseudo-transparency = false
