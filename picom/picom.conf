## ----- Shadows ----- ##

shadow = true;

shadow-radius = 7;
#shadow-opacity = .6
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color = "#000000"

## ----- Fading ----- ##

fading = true;

fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5
no-fading-openclose = false
no-fading-destroyed-argb = false

## ----- Transparency ----- ##

frame-opacity = 1.0;

# inactive-dim-fixed = true

## ----- Corners ----- ##

corner-radius = 6

#################################
#       General Settings        #
#################################

# Available backends "xrender" "glx" "egl"
backend = "egl"

dithered-present = false;
vsync = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

use-damage = true;
xrender-sync-fence = true
# transparent-clipping = false

#################################
#             Rules             #
#################################

blur:

	{
		method = "gaussian";
		size = 6;
		deviation = 6.0;
		kern = "3x3box"
	}

rules: (

	# --- Default global ---
	{ blur-background = true; fade = false; 
	},

	# --- Window types ---
	{
		match = "window_type = 'normal'";
		fade = true;
		shadow = true;
		opacity = 0.70;
	},

	{
		match = "window_type = 'dialog'";
		shadow = true;
	},

	{
		match = "window_type = 'tooltip'";
		corner-radius = 0;
		opacity = 0.90;
	},

	{
		match = "window_type = 'dock'";
		corner-radius = 0;
		fade = true;
	},

	{
		match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu'";
		corner-radius = 0;
	},

	# --- Exceções por app ---
	{
		match = "class_g = 'slop'";
		opacity = 1.0;
		blur-background = false;
		fade = false;
	},

	{
		match = "class_i = 'ghostty' || class_i = 'kitty' || class_g = 'FloaTerm'";
		opacity = 0.5;
		blur-background = true;
	},

	{
		match = "class_g = 'zen-browser'";
		opacity = 1.0;
		blur-background = false;
		fade = false;
		animations = ();
	},

	# --- Janelas ocultas/minimizadas ---
	{
		match = "_NET_WM_STATE *= '_NET_WM_STATE_HIDDEN' || class_g = 'Updating'";
		opacity = 0.93;
		blur-background = false;
		corner-radius = 0;
	},

	# --- Apps sem decoração: corner-radius=0 + shadow=false ---
	{
		match = "class_g = 'Polybar'  ||"
				"class_g = 'eww-bar'  ||"
				"class_g = 'Dunst'    ||"
				"class_g = 'Rofi'     ||"
				"class_g = 'mpv'      ||"
				"class_g = 'Viewnior' ||"
				"class_g = 'retroarch'";
		corner-radius = 0;
		shadow = false;
	},

	# --- Apps sem sombra (mantêm corner-radius) ---
	{
		match = "class_g = 'Eww'      ||"
				"class_g = 'jgmenu'   ||"
				"class_g = 'scratch'  ||"
				"class_g = 'Spotify'  ||"
				"class_g = 'Screenkey'";
		shadow = false;
	},

	# --- Propriedades X11 que suprimem sombra ---
	{
		match = "name = 'Notification' || class_g ?= 'Notify-osd' || _GTK_FRAME_EXTENTS@";
		shadow = false;
	},

@include "picom-animations.conf"

)
